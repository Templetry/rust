name: Verify forms

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly, so upstream drift surfaces here and not in a user project.
    - cron: "0 6 * * 1"

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  form:
    name: ${{ matrix.form }} (default)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        form: [cli, axum-service]
    steps:
      - uses: actions/checkout@v4
      - uses: Templetry/.github/actions/setup-templetry@main
      - name: Render
        run: |
          templetry render --template "./${{ matrix.form }}" --out "$RUNNER_TEMP/out" \
            --set "project_name=Verify App"
      - uses: dtolnay/rust-toolchain@stable
      - name: Build and test rendered output
        working-directory: ${{ runner.temp }}/out
        run: |
          cargo build --verbose
          cargo test --verbose
